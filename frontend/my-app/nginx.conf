server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Export statique d'expo-router : /explore -> explore.html, sinon index.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Fichiers du bundle hashés : cache long
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
