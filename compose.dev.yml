services:
  postgres:
    image: postgres:18-alpine
    container_name: projet66-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devtest
      POSTGRES_DB: projet66
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d projet66"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projet66-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://dev:devtest@postgres:5432/projet66
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/my-app
      dockerfile: Dockerfile
    container_name: projet66-frontend
    restart: unless-stopped
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: localhost
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./frontend/my-app:/app
      - frontend_node_modules:/app/node_modules
    command: npm run web -- --host lan
    depends_on:
      - backend

volumes:
  postgres18_data:
  backend_node_modules:
  frontend_node_modules:
